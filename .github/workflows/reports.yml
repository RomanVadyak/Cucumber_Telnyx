name: Publish Cypress Report

on:
  push:
    branches: [main]

jobs:
  cypress-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.18.0

      - name: Install dependencies
        run: npm install

      - name: Run Cypress tests with Mochawesome
        run: npx cypress run --config-file configs/cypress.config.js

      - name: Rename mochawesome.html to index.html
        run: |
          REPORT_PATH="cypress/reports/mochawesome-report"
          if [ -f "$REPORT_PATH/mochawesome.html" ]; then
            mv "$REPORT_PATH/mochawesome.html" "$REPORT_PATH/index.html"
          else
            echo "❌ Report not found at $REPORT_PATH/mochawesome.html"
            exit 1
          fi

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cypress/reports/mochawesome-report
          publish_branch: gh-pages
          force_orphan: true
